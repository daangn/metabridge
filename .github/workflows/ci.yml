name: CI
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22.14.0
          package-manager-cache: false
      - run: corepack enable
      - run: yarn install --immutable
      - run: yarn build
      - run: yarn workspace @metabridge/plugin-typescript-docs template:typecheck
      - run: yarn workspace @metabridge/plugin-typescript-docs exec playwright install --with-deps chromium
      - run: yarn workspace @metabridge/plugin-typescript-docs test:browser
      - run: yarn changeset status --since=origin/main
        if: ${{ !startsWith(github.head_ref || github.ref_name, 'changeset-release/') }}
